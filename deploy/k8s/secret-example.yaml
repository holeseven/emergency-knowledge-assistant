# ============================================================
# Secret 模板 - 敏感信息集中管理
# 重要：此文件仅为模板示例，实际部署时请替换占位符
# 不要将真实的 Secret 提交到 Git 仓库！
# ============================================================
# 使用方式（二选一）：
#   方式1：手动 base64 编码后填入 data 字段
#     echo -n "your-api-key" | base64
#   方式2：使用 kubectl 命令直接创建（推荐）
#     kubectl create secret generic rag-secrets \
#       --namespace=rag-system \
#       --from-literal=glm-api-key=YOUR_REAL_API_KEY \
#       --from-literal=redis-password=YOUR_REDIS_PASSWORD
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: rag-secrets
  namespace: rag-system
  labels:
    app: rag-system
# Opaque 类型：通用 Secret，存储任意键值对
type: Opaque
data:
  # GLM 大模型 API Key（base64 编码后的值）
  # 占位符 "REPLACE_WITH_BASE64_ENCODED_VALUE" 的 base64 = UkVQTEFDRV9XSVRIX0JBU0U2NF9FTkNPREVEX1ZBTFVF
  glm-api-key: "UkVQTEFDRV9XSVRIX0JBU0U2NF9FTkNPREVEX1ZBTFVF"
  # Redis 密码（如果 Redis 配置了密码认证）
  redis-password: "UkVQTEFDRV9XSVRIX0JBU0U2NF9FTkNPREVEX1ZBTFVF"
