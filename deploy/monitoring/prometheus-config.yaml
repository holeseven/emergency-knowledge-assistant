# ============================================================
# Prometheus 监控抓取配置
# author: lxy
# ============================================================
#
# 【监控指标说明】
# 本配置定义 Prometheus 如何从各服务抓取（scrape）监控指标。
# 采集的核心指标包括：
#
#   1. QPS（每秒请求量）
#      - 指标名：http_requests_total / http_server_requests_seconds_count
#      - 用途：观察流量趋势，判断是否需要扩容
#      - 计算：rate(http_requests_total[1m])
#
#   2. 内存使用
#      - 指标名：process_resident_memory_bytes / jvm_memory_used_bytes
#      - 用途：检测内存泄漏，预防 OOM Kill
#
#   3. GC（垃圾回收）
#      - 指标名：jvm_gc_pause_seconds_sum / jvm_gc_pause_seconds_count
#      - 用途：Java 网关服务的 GC 停顿监控，Full GC 频率过高需告警
#      - Python 服务关注：python_gc_collections_total
#
#   4. 限流触发数
#      - 指标名：rate_limiter_rejected_total / sentinel_block_total
#      - 用途：观察限流是否频繁触发，判断阈值是否合理
#      - 频繁触发 → 可能需要扩容或调大限流阈值
#
#   5. 检索延迟 P99
#      - 指标名：http_server_requests_seconds（histogram）
#      - 用途：histogram_quantile(0.99, ...) 计算 P99 延迟
#      - RAG 场景下 P99 超过 3s 需要告警排查（ES 慢查询 or 模型推理超时）
#
#   6. RocketMQ 消费积压
#      - 指标名：rocketmq_consumer_offset_diff / rocketmq_consumer_lag
#      - 用途：消息积压持续增长说明消费者处理能力不足
#      - 积压 > 10000 条应触发扩容或告警
#
# ============================================================

# Prometheus ConfigMap - 部署到 K8s 集群中供 Prometheus Pod 挂载
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: rag-system
  labels:
    app: prometheus
data:
  prometheus.yml: |
    # 全局配置
    global:
      scrape_interval: 15s        # 默认抓取间隔：每 15 秒采集一次指标
      evaluation_interval: 15s    # 规则评估间隔：每 15 秒执行一次告警规则
      scrape_timeout: 10s         # 单次抓取超时时间

    # 告警规则文件（可扩展）
    rule_files:
      - "/etc/prometheus/rules/*.yml"

    # 抓取目标配置
    scrape_configs:

      # --------------------------------------------------------
      # Job 1：API 网关服务（Java Spring Boot）
      # 端口：8080，指标端点：/actuator/prometheus
      # 采集指标：QPS、JVM 内存、GC 停顿、限流触发数、HTTP 延迟
      # --------------------------------------------------------
      - job_name: "gateway-service"
        metrics_path: "/actuator/prometheus"
        scrape_interval: 10s      # 网关流量大，缩短采集间隔以提高精度
        static_configs:
          - targets:
              - "gateway-service:8080"
            labels:
              service: "gateway"
              tier: "gateway"
              language: "java"

      # --------------------------------------------------------
      # Job 2：RAG 检索服务（Python FastAPI）
      # 端口：8000，指标端点：/metrics
      # 采集指标：QPS、进程内存、Python GC、检索延迟 P99、模型推理耗时
      # --------------------------------------------------------
      - job_name: "rag-service"
        metrics_path: "/metrics"
        scrape_interval: 10s
        static_configs:
          - targets:
              - "rag-service:8000"
            labels:
              service: "rag"
              tier: "backend"
              language: "python"

      # --------------------------------------------------------
      # Job 3：RocketMQ Exporter（消息队列指标）
      # 监控消费积压、生产速率、消费速率
      # 需要单独部署 rocketmq-exporter（开源组件）
      # --------------------------------------------------------
      - job_name: "rocketmq"
        metrics_path: "/metrics"
        scrape_interval: 30s      # MQ 指标变化较慢，30 秒足够
        static_configs:
          - targets:
              - "rocketmq-exporter:5557"
            labels:
              service: "rocketmq"
              tier: "middleware"

      # --------------------------------------------------------
      # Job 4：Elasticsearch Exporter
      # 监控 ES 集群健康、索引大小、查询延迟
      # --------------------------------------------------------
      - job_name: "elasticsearch"
        metrics_path: "/metrics"
        scrape_interval: 30s
        static_configs:
          - targets:
              - "elasticsearch-exporter:9114"
            labels:
              service: "elasticsearch"
              tier: "middleware"

      # --------------------------------------------------------
      # Job 5：Redis Exporter
      # 监控缓存命中率、内存使用、连接数
      # --------------------------------------------------------
      - job_name: "redis"
        metrics_path: "/metrics"
        scrape_interval: 15s
        static_configs:
          - targets:
              - "redis-exporter:9121"
            labels:
              service: "redis"
              tier: "middleware"

      # --------------------------------------------------------
      # Job 6：Kubernetes 节点（可选，需 node-exporter DaemonSet）
      # 监控宿主机 CPU、内存、磁盘、网络
      # --------------------------------------------------------
      - job_name: "kubernetes-nodes"
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
